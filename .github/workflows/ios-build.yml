name: iOS Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build iOS & watchOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available SDKs
        run: xcodebuild -showsdks

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build iOS App
        run: |
          set -o pipefail
          xcodebuild build \
            -project AirWhisperTrain.xcodeproj \
            -scheme AirWhisperTrain \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build watchOS App
        run: |
          WATCH_UDID=$(xcrun simctl list devices available | awk '/^-- watchOS 26.5 --/{in_watch=1; next} /^--/{in_watch=0} in_watch && /Apple Watch/ {print; exit}' | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p')
          test -n "$WATCH_UDID"
          set -o pipefail
          xcodebuild build \
            -project AirWhisperTrain.xcodeproj \
            -scheme 'AirWhisperTrain-Watch Watch App' \
            -destination "platform=watchOS Simulator,id=$WATCH_UDID" \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AirWhisperTrain.xcodeproj \
            -scheme AirWhisperTrain \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AirWhisperTrain.xcodeproj \
            -scheme AirWhisperTrain \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-and-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
